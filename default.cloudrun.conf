server {
    listen 8080;
    server_name _;
    client_max_body_size 12M;
    server_tokens off;

    # Canonical redirect: always redirect naked domain to www
    if ($host = "neighborlyminds.me") {
        return 301 https://www.neighborlyminds.me$request_uri;
    }

    location /api/ {
        proxy_pass http://34.135.219.183;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host 34.135.219.183;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cache immutable hashed assets
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Ensure index.html is NEVER cached by Safari or proxy heuristics
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
